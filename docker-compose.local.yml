version: '3.8'

services:
  northscore-mcp:
    build: .
    container_name: northscore-mcp
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: development
      MCP_TRANSPORT: http
      HOST: 0.0.0.0
      PORT: 3002
      NORTHSCORE_API_BASE_URL: http://northscore-api:8080/api/v1
      NORTHSCORE_STATS_API_KEY: ${NORTHSCORE_STATS_API_KEY}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
    networks:
      - northscore-api_default
    restart: unless-stopped

networks:
  northscore-api_default:
    external: true
